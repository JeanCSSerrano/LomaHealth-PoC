<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - LomaHealth</title>
    <link rel="stylesheet" href="../assets/style.css"">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <img src="../assets/images/Lomahealth_logo.png" alt="LomaHealth Logo" class="logo-img">
            <span>LomaHealth</span>
        </div>
        <ul class="nav">
            <!-- All links wired up -->
            <li onclick="window.location.href='index.html'">Dashboard</li>
            <li onclick="window.location.href='book-appointment.html'">Book Appointment</li>
            <li onclick="window.location.href='my-appointments.html'">My Appointments</li>
            <li onclick="window.location.href='health-record.html'">Health Record</li>
            <!-- Active class is here now! -->
            <li class="active">Profile</li>
        </ul>
        <button class="logout-btn" onclick="window.location.href='../login.html'">Log Out</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Top Navigation Bar -->
        <div class="topbar">
            <div class="bell-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div class="user-info">
                <div class="avatar">JD</div>
                <div class="user-details">
                    <strong>Juana Dela Cruz</strong>
                    <span class="badge">Resident</span>
                    <small>Proper / Main Barangay Hall</small>
                </div>
            </div>
        </div>

        <!-- Profile Area -->
        <div class="dashboard-area">
            <span class="subtitle">ACCOUNT</span>
            <h1 class="page-title">My profile</h1>

            <!-- Main Profile Card -->
            <div class="profile-card">
                
                <!-- Profile Header (Avatar & Name) -->
                <div class="profile-header">
                    <div class="profile-avatar-large">
                        <!-- Custom SVG for the purple user icon -->
                        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#5b21b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <h2>Juana Dela Cruz</h2>
                        <p class="profile-location">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            Proper / Main Barangay Hall
                        </p>
                    </div>
                </div>

                <!-- Profile Form Grid -->
                <div class="profile-form">
                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" value="Juana" readonly>
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" value="Dela Cruz" readonly>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" value="1999-09-19" readonly>
                    </div>
                    
                    <div class="form-group email-group">
                        <label>Email</label>
                        <input type="email" value="juanadelacruz@gmail.com" readonly>
                    </div>
                    <div class="form-group">
                        <label>Sex</label>
                        <input type="text" value="Female" readonly>
                    </div>
                    
                    <div class="form-group address-group">
                        <label>Address</label>
                        <input type="text" value="123 Fake Street Brgy. Loma de Gato Marilao Bulacan" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label>Mobile no.</label>
                        <input type="text" value="091234567890" readonly>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
